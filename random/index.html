<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>随机文章 | Random Post</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
  }
  .loading {
    text-align: center;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loading">
  <div class="spinner"></div>
  <p>正在为你挑选一篇文章...</p>
</div>
<script>
(function() {
  // Fetch sitemap and extract post URLs (only actual blog posts with date pattern)
  fetch('/sitemap.xml')
    .then(function(res) { return res.text(); })
    .then(function(xml) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(xml, 'text/xml');
      var locs = doc.querySelectorAll('url > loc');
      var postUrls = [];
      for (var i = 0; i < locs.length; i++) {
        var url = locs[i].textContent;
        // Only include actual blog posts (URL pattern: /YYYY/MM/DD/slug/)
        if (/\/\d{4}\/\d{2}\/\d{2}\//.test(url)) {
          postUrls.push(url);
        }
      }
      if (postUrls.length > 0) {
        var randomUrl = postUrls[Math.floor(Math.random() * postUrls.length)];
        window.location.replace(randomUrl);
      } else {
        window.location.replace('/');
      }
    })
    .catch(function() {
      // Fallback: redirect to homepage
      window.location.replace('/');
    });
})();
</script>
